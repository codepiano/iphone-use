[package]
name = "phone-self-launch"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "ipu_self_launch"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "vendor/idevice", default-features = false, features = ["ring", "tcp", "xctest", "remote_pairing", "tunnel_tcp_stack"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
