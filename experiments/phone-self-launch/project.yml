name: PhoneSelfLaunch
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    DEVELOPMENT_TEAM: 6ZPXG4KVVS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  PhoneSelfLaunch:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.self-launch
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/LaunchBridge.h
        OTHER_LDFLAGS: ["$(inherited)", "-lipu_self_launch", "-framework", "Security", "-framework", "SystemConfiguration", "-lresolv", "-liconv"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/target/aarch64-apple-ios/release"]
