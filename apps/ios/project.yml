name: IPhoneUseRemote
options:
  bundleIdPrefix: com.leeguoo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 6ZPXG4KVVS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "17"
targets:
  IPhoneUseRemote:
    type: application
    platform: iOS
    sources:
      - IPhoneUseRemote/Sources
      - IPhoneUseRemote/Resources
      - Shared
      - path: ../../experiments/phone-self-host/THIRD-PARTY-NOTICES.txt
        buildPhase: resources
    dependencies:
      - target: AgentActivityWidget
      - target: PhoneLocalNetwork
      - target: PhoneRuntimeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote
        PRODUCT_NAME: Phone Use Remote
        PRODUCT_MODULE_NAME: IPhoneUseRemote
        INFOPLIST_FILE: IPhoneUseRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalRuntime.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: IPhoneUseRemote/Sources/SessionBridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/SessionLibraries/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lipu_browser_session -framework Security -framework SystemConfiguration"
  PhoneRuntimeCore:
    type: framework
    platform: iOS
    sources:
      - ../../experiments/phone-self-host/Shared
      - ../../experiments/phone-self-host/Sources/LocalTunnel.swift
      - ../../experiments/phone-self-host/Sources/RuntimeFacade.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.runtime-core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES
  PhoneLocalNetwork:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: ../../experiments/phone-self-host/Tunnel
        excludes: [Info.plist]
      - ../../experiments/phone-self-host/Shared
      - path: ../../experiments/phone-self-host/Resources/DeveloperImage
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote.tunnel
        INFOPLIST_FILE: LocalRuntime-Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalRuntime.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) $(IPU_HOST_LDFLAGS)"
  AgentActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - AgentActivityWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote.activity
        INFOPLIST_FILE: AgentActivityWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  IPhoneUseRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IPhoneUseRemoteTests
    dependencies:
      - target: IPhoneUseRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product name has spaces; xcodegen's default host path uses the target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Phone Use Remote.app/Phone Use Remote"
        SWIFT_STRICT_CONCURRENCY: complete
  IPhoneUseRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IPhoneUseRemoteUITests
    dependencies:
      - target: IPhoneUseRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IPhoneUseRemote
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  IPhoneUseRemote:
    build:
      targets:
        IPhoneUseRemote: all
        IPhoneUseRemoteTests: [test]
    test:
      targets:
        - IPhoneUseRemoteTests
  # Needs Tools/mock_daemon.py running (see README); kept out of the main
  # scheme so `xcodebuild test` stays self-contained.
  IPhoneUseRemoteUITests:
    build:
      targets:
        IPhoneUseRemote: all
        IPhoneUseRemoteUITests: [test]
    test:
      targets:
        - IPhoneUseRemoteUITests
